[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot-utility"
description = "Terminal-based utility for managing, monitoring, and analyzing Telegram bots"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
authors = [{ name = "Telegram Bot Utility contributors" }]
keywords = ["telegram", "bot", "utility", "telethon", "dumper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "telethon>=1.31",
    "PySocks>=1.7",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
telegram-bot-utility = "core.cli:run"

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[tool.setuptools]
py-modules = ["main"]
packages = ["core"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    "B008",
    # Project supports Python 3.9, where `X | None` syntax is not valid.
    "UP045",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
